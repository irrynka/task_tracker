{% extends "base.html" %}

{% block content %}
<h2>Delete Comment</h2>
<p>Are you sure you want to delete this comment?</p>
<p><em>{{ object.content }}</em></p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Yes, delete</button>
  <a href="{% url 'task-detail' object.task.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
