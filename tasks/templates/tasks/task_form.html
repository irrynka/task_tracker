{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        {% if view.title %}
            <h2 class="mb-4 text-center">{{ view.title }}</h2>
        {% else %}
            <h2 class="mb-4 text-center">Task Form</h2>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Save</button>
            <a href="{% url 'task-list' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
